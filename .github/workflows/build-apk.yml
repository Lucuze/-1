name: Build APK

on:
  push:
    branches: [ main, 'copilot/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync web assets to Android project
        run: |
          mkdir -p android/app/src/main/assets/icons
          cp index.html style.css game.js manifest.json sw.js android/app/src/main/assets/
          cp icons/*.png icons/icon.svg android/app/src/main/assets/icons/

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/hangul-adventure.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hangul-adventure-apk
          path: output/hangul-adventure.apk
          retention-days: 90
